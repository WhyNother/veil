<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VEIL — Dashboard</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            color: white;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.82)
                ),
                url("veil-bg.jpg");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

        }

        .container {

            width: 100%;

            max-width: 900px;

            margin: auto;

            padding: 30px 20px;

        }

        header {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            margin-bottom: 30px;

        }

        .logo {

            font-size: 32px;

            font-weight: bold;

            letter-spacing: 8px;

        }

        .account-email {

            margin-top: 8px;

            color: #80bfff;

            font-size: 13px;

            word-break: break-all;

        }

        .status {

            color: #55ff88;

            font-size: 13px;

        }

        .welcome {

            margin-bottom: 25px;

        }

        .welcome h2 {

            font-size: 25px;

            margin-bottom: 8px;

        }

        .welcome p {

            color: #aaa;

        }

        .card {

            background:
                rgba(12, 12, 16, 0.82);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 18px;

            padding: 25px;

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 15px 50px
                rgba(0, 0, 0, 0.65);

        }

        .card-title {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

            gap: 15px;

        }

        .card-title h3 {

            font-size: 20px;

        }

        .add-button {

            background: #a80000;

            color: white;

            border: none;

            padding: 11px 16px;

            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;

            white-space: nowrap;

        }

        .add-button:hover {

            background: #d00000;

        }

        .device {

            border:
                1px solid #292929;

            border-radius: 14px;

            padding: 18px;

            background:
                rgba(0, 0, 0, 0.35);

            margin-bottom: 15px;

        }

        .device:last-child {

            margin-bottom: 0;

        }

        .device-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 15px;

        }

        .device-name {

            font-size: 18px;

            font-weight: bold;

        }

        .device-id {

            color: #666;

            font-size: 11px;

            margin-top: 5px;

            word-break: break-all;

        }

        .online {

            color: #55ff88;

            font-size: 13px;

            white-space: nowrap;

        }

        .offline {

            color: #ff5555;

            font-size: 13px;

            white-space: nowrap;

        }

        .device-info {

            color: #999;

            font-size: 13px;

            line-height: 1.8;

            margin-bottom: 15px;

        }

        .device-location {

            color: #80bfff;

            font-size: 12px;

            margin-top: 7px;

        }

        .buttons {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

        }

        .action {

            padding: 12px;

            border-radius: 9px;

            border:
                1px solid #333;

            background: #17171d;

            color: white;

            cursor: pointer;

            font-weight: bold;

        }

        .action:hover {

            background: #25252d;

        }

        .action.connected {

            border-color: #245c3d;

            background: #14231b;

        }

        .empty {

            text-align: center;

            padding: 40px 20px;

            color: #777;

        }

        #map {

            width: 100%;

            height: 400px;

            margin-top: 20px;

            border-radius: 14px;

            overflow: hidden;

            display: none;

        }

        .map-title {

            margin-top: 25px;

            margin-bottom: 10px;

            font-size: 18px;

            font-weight: bold;

            display: none;

        }

        @media (max-width: 600px) {

            header {

                align-items: flex-start;

            }

            .card-title {

                align-items: stretch;

                flex-direction: column;

            }

            .add-button {

                width: 100%;

            }

            .buttons {

                grid-template-columns: 1fr;

            }

            .device-top {

                flex-direction: column;

            }

            #map {

                height: 320px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================================
         HEADER
         ================================================= -->

    <header>

        <div>

            <div class="logo">
                VEIL
            </div>

            <div
                class="account-email"
                id="accountEmail"
            >
                ✉️ Memuat akun...
            </div>

        </div>


        <div class="status">
            ● SYSTEM ONLINE
        </div>

    </header>


    <!-- =================================================
         WELCOME
         ================================================= -->

    <section class="welcome">

        <h2>
            Dashboard
        </h2>

        <p>
            Lost Phone Protection System
        </p>

    </section>


    <!-- =================================================
         PERANGKAT
         ================================================= -->

    <section class="card">


        <div class="card-title">

            <h3>
                Perangkat Saya
            </h3>


            <!--
                pair.html = HALAMAN PEMBUAT KODE
            -->

            <button
                class="add-button"
                onclick="addDevice()"
            >
                + Tambah HP
            </button>

        </div>


        <!--
            Semua perangkat akan dibuat
            secara otomatis oleh JavaScript.
        -->

        <div id="devicesContainer">

            <div class="empty">

                Memuat perangkat...

            </div>

        </div>


        <!-- =================================================
             MAP
             ================================================= -->

        <div
            class="map-title"
            id="mapTitle"
        >
            📍 Lokasi Perangkat
        </div>


        <div id="map"></div>


    </section>


</div>


<script>


// =====================================================
// DATA GLOBAL
// =====================================================

let deviceConnected = false;

let connectedDevice = null;

let connectedDevices = [];

let map = null;

let locationMarker = null;


// =====================================================
// TAMBAH HP
// =====================================================

function addDevice() {

    // pair.html = halaman untuk membuat kode pairing

    window.location.href =
        "pair.html";

}


// =====================================================
// TAMPILKAN EMAIL
// =====================================================

function showAccountEmail() {

    const email =
        localStorage.getItem(
            "veil_verified_email"
        ) ||
        localStorage.getItem(
            "veil_email"
        );


    const element =
        document.getElementById(
            "accountEmail"
        );


    if (!element) {
        return;
    }


    if (email) {

        element.innerHTML =
            "✉️ " +
            escapeHtml(email);

    } else {

        element.innerHTML =
            "✉️ Email VEIL tidak ditemukan.";

    }

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


// =====================================================
// CEK STATUS DEVICE
// =====================================================

async function checkDeviceStatus() {

    try {

        const email =
            localStorage.getItem(
                "veil_verified_email"
            ) ||
            localStorage.getItem(
                "veil_email"
            );


        if (!email) {

            deviceConnected = false;

            connectedDevice = null;

            connectedDevices = [];

            renderDevices();

            return;

        }


        const response =
            await fetch(
                "/api/device-status",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email

                        })

                }
            );


        const result =
            await response.json();


        console.log(
            "VEIL DEVICE STATUS:",
            result
        );


        if (

            result.success === true &&

            Array.isArray(
                result.devices
            )

        ) {

            connectedDevices =
                result.devices;


            deviceConnected =
                connectedDevices.length > 0;


            connectedDevice =
                connectedDevices.length > 0

                    ? connectedDevices[0]

                    : null;

        } else {

            deviceConnected = false;

            connectedDevice = null;

            connectedDevices = [];

        }


        renderDevices();


    } catch (error) {

        console.error(
            "VEIL STATUS ERROR:",
            error
        );


        deviceConnected = false;

        connectedDevice = null;

        connectedDevices = [];

        renderDevices();

    }

}


// =====================================================
// TAMPILKAN SEMUA DEVICE
// =====================================================

function renderDevices() {

    const container =
        document.getElementById(
            "devicesContainer"
        );


    if (!container) {
        return;
    }


    if (
        connectedDevices.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                Belum ada perangkat
                yang terhubung.

            </div>

        `;

        return;

    }


    container.innerHTML =

        connectedDevices
            .map(

                function(device) {


                    const name =
                        escapeHtml(

                            device.deviceName ||

                            "Perangkat VEIL"

                        );


                    const rawDeviceId =
                        device.deviceId || "";


                    const encodedDeviceId =
                        encodeURIComponent(
                            rawDeviceId
                        );


                    const status =
                        device.status ===
                        "connected"

                            ? "🟢 Terhubung"

                            : "🔴 Offline";


                    const statusClass =
                        device.status ===
                        "connected"

                            ? "online"

                            : "offline";


                    let locationText =
                        "📍 Lokasi belum tersedia";


                    if (
                        device.location
                    ) {

                        locationText =

                            "📍 Lokasi terakhir: " +

                            Number(
                                device.location.latitude
                            ).toFixed(6) +

                            ", " +

                            Number(
                                device.location.longitude
                            ).toFixed(6);

                    }


                    return `

                        <div class="device">


                            <div class="device-top">


                                <div>


                                    <div
                                        class="device-name"
                                    >

                                        📱 ${name}

                                    </div>


                                    <div
                                        class="device-id"
                                    >

                                        ID:
                                        ${escapeHtml(
                                            rawDeviceId
                                        )}

                                    </div>


                                </div>


                                <div
                                    class="${statusClass}"
                                >

                                    ${status}

                                </div>


                            </div>


                            <div
                                class="device-info"
                            >

                                Perangkat VEIL
                                berhasil terhubung.

                                <br>

                                Status:
                                ${escapeHtml(
                                    device.status ||
                                    "unknown"
                                )}


                                <div
                                    class="device-location"
                                >

                                    ${locationText}

                                </div>

                            </div>


                            <div
                                class="buttons"
                            >


                                <button
                                    class="action connected"
                                    onclick="locationFeature('${encodedDeviceId}')"
                                >

                                    📍 Lokasi

                                </button>


                                <button
                                    class="action connected"
                                    onclick="lostModeFeature('${encodedDeviceId}')"
                                >

                                    🔒 Lost Mode

                                </button>


                                <button
                                    class="action connected"
                                    onclick="textFeature('${encodedDeviceId}')"
                                >

                                    🔊 Pesan

                                </button>


                            </div>


                        </div>

                    `;

                }

            )

            .join("");

}


// =====================================================
// CARI DEVICE BERDASARKAN ID
// =====================================================

function getDeviceById(
    deviceId
) {

    return connectedDevices.find(

        function(device) {

            return (
                device.deviceId ===
                deviceId
            );

        }

    );

}


// =====================================================
// TAMPILKAN LOKASI DI MAP
// =====================================================

function showLocationOnMap(

    latitude,

    longitude,

    accuracy,

    deviceName

) {


    const mapElement =
        document.getElementById(
            "map"
        );


    const mapTitle =
        document.getElementById(
            "mapTitle"
        );


    if (!mapElement) {

        alert(
            "Map tidak ditemukan."
        );

        return;

    }


    mapElement.style.display =
        "block";


    if (mapTitle) {

        mapTitle.style.display =
            "block";

    }


    // =================================================
    // BUAT MAP PERTAMA KALI
    // =================================================

    if (!map) {

        map =
            L.map(
                "map"
            ).setView(

                [
                    latitude,
                    longitude
                ],

                16

            );


        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom: 19,

                attribution:
                    "&copy; OpenStreetMap"

            }

        ).addTo(
            map
        );


    } else {

        map.setView(

            [
                latitude,
                longitude
            ],

            16

        );

    }


    // =================================================
    // MARKER
    // =================================================

    if (locationMarker) {

        locationMarker.setLatLng(

            [
                latitude,
                longitude
            ]

        );

    } else {

        locationMarker =
            L.marker(

                [
                    latitude,
                    longitude
                ]

            ).addTo(
                map
            );

    }


    // =================================================
    // POPUP
    // =================================================

    locationMarker
        .bindPopup(

            "📱 <b>" +

            escapeHtml(

                deviceName ||

                "Perangkat VEIL"

            ) +

            "</b><br>" +

            "📍 Lokasi perangkat<br>" +

            "Akurasi: ±" +

            Number(
                accuracy || 0
            ).toFixed(1) +

            " meter<br><br>" +


            '<a href="https://www.google.com/maps/dir/?api=1&destination=' +

            latitude +

            "," +

            longitude +

            '" target="_blank" ' +

            'style="' +

            'display:inline-block;' +

            'padding:10px 14px;' +

            'background:#e53935;' +

            'color:white;' +

            'text-decoration:none;' +

            'border-radius:8px;' +

            'font-weight:bold;' +

            '">' +

            "🧭 Arahkan ke lokasi" +

            "</a>"

        )

        .openPopup();


    setTimeout(

        function() {

            map.invalidateSize();

        },

        200

    );

}


// =====================================================
// MINTA LOKASI DEVICE TERTENTU
// =====================================================

async function locationFeature(
    deviceIdEncoded
) {


    const deviceId =
        decodeURIComponent(
            deviceIdEncoded
        );


    const device =
        getDeviceById(
            deviceId
        );


    if (!device) {

        alert(
            "Perangkat tidak ditemukan."
        );

        return;

    }


    const email =
        localStorage.getItem(
            "veil_verified_email"
        ) ||

        localStorage.getItem(
            "veil_email"
        );


    if (!email) {

        alert(
            "Email VEIL tidak ditemukan."
        );

        return;

    }


    try {


        // =================================================
        // REQUEST LOKASI KE SERVER
        // =================================================

        const requestResponse =
            await fetch(

                "/api/request-location",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            deviceId:
                                deviceId

                        })

                }

            );


        const requestResult =
            await requestResponse.json();


        console.log(

            "VEIL LOCATION REQUEST:",

            requestResult

        );


        if (

            !requestResponse.ok ||

            requestResult.success !== true

        ) {

            alert(

                requestResult.message ||

                "Permintaan lokasi gagal."

            );

            return;

        }


        alert(

            "📍 Permintaan lokasi dikirim.\n\n" +

            "Menunggu GPS perangkat..."

        );


        // =================================================
        // TUNGGU LOKASI TERBARU
        // =================================================

        let attempts = 0;

        const maxAttempts = 15;


        const timer =

            setInterval(

                async function() {


                    attempts++;


                    try {


                        const response =

                            await fetch(

                                "/api/device-location",

                                {

                                    method:
                                        "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify({

                                            email:
                                                email,

                                            deviceId:
                                                deviceId

                                        })

                                }

                            );


                        const result =

                            await response.json();


                        console.log(

                            "VEIL LOCATION CHECK:",

                            result

                        );


                        if (

                            result.success === true &&

                            result.location

                        ) {


                            clearInterval(
                                timer
                            );


                            const location =
                                result.location;


                            // Simpan lokasi terbaru
                            const currentDevice =
                                getDeviceById(
                                    deviceId
                                );


                            if (
                                currentDevice
                            ) {

                                currentDevice.location =
                                    location;

                            }


                            // Tampilkan map
                            showLocationOnMap(

                                location.latitude,

                                location.longitude,

                                location.accuracy,

                                device.deviceName

                            );


                            // Refresh daftar
                            renderDevices();


                            return;

                        }


                        if (

                            attempts >=
                            maxAttempts

                        ) {

                            clearInterval(
                                timer
                            );


                            alert(

                                "⏱️ Lokasi belum diterima.\n\n" +

                                "Pastikan HP teman masih membuka " +

                                "halaman pairing VEIL dan izin lokasi aktif."

                            );

                        }


                    } catch (error) {

                        console.error(

                            "VEIL LOCATION CHECK ERROR:",

                            error

                        );

                    }


                },

                2000

            );


    } catch (error) {

        console.error(

            "VEIL LOCATION REQUEST ERROR:",

            error

        );


        alert(

            "Gagal meminta lokasi perangkat."

        );

    }

}


// =====================================================
// LOST MODE
// =====================================================

function lostModeFeature(
    deviceIdEncoded
) {


    const deviceId =
        decodeURIComponent(
            deviceIdEncoded
        );


    const device =
        getDeviceById(
            deviceId
        );


    if (!device) {

        alert(
            "Perangkat tidak ditemukan."
        );

        return;

    }


    alert(

        "📱 " +

        (

            device.deviceName ||

            "Perangkat VEIL"

        ) +

        "\n\n" +

        "🔒 Lost Mode siap digunakan."

    );

}


// =====================================================
// PESAN
// =====================================================

function textFeature(
    deviceIdEncoded
) {


    const deviceId =
        decodeURIComponent(
            deviceIdEncoded
        );


    const device =
        getDeviceById(
            deviceId
        );


    if (!device) {

        alert(
            "Perangkat tidak ditemukan."
        );

        return;

    }


    alert(

        "📱 " +

        (

            device.deviceName ||

            "Perangkat VEIL"

        ) +

        "\n\n" +

        "🔊 Fitur pesan siap digunakan."

    );

}


// =====================================================
// MULAI
// =====================================================

showAccountEmail();

checkDeviceStatus();


// =====================================================
// REFRESH STATUS SETIAP 3 DETIK
// ===========================


setInterval(

    checkDeviceStatus,

    3000

);


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VEIL — Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            color: white;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.82)
                ),
                url("veil-bg.jpg");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

        }


        .container {

            width: 100%;

            max-width: 900px;

            margin: auto;

            padding: 30px 20px;

        }


        header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }


        .logo {

            font-size: 32px;

            font-weight: bold;

            letter-spacing: 8px;

        }


        .status {

            color: #55ff88;

            font-size: 13px;

        }


        .welcome {

            margin-bottom: 25px;

        }


        .welcome h2 {

            font-size: 25px;

            margin-bottom: 8px;

        }


        .welcome p {

            color: #aaa;

        }


        .card {

            background:
                rgba(12, 12, 16, 0.82);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 18px;

            padding: 25px;

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 15px 50px
                rgba(0, 0, 0, 0.65);

        }


        .card-title {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .card-title h3 {

            font-size: 20px;

        }


        .add-button {

            background: #a80000;

            color: white;

            border: none;

            padding: 11px 16px;

            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;

        }


        .add-button:hover {

            background: #d00000;

        }


        .device {

            border:
                1px solid #292929;

            border-radius: 14px;

            padding: 18px;

            background:
                rgba(0, 0, 0, 0.35);

            margin-bottom: 15px;

        }


        .device-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

        }


        .device-name {

            font-size: 18px;

            font-weight: bold;

        }


        .online {

            color: #55ff88;

            font-size: 13px;

        }


        .offline {

            color: #ff5555;

            font-size: 13px;

        }


        .device-info {

            color: #999;

            font-size: 13px;

            line-height: 1.8;

            margin-bottom: 15px;

        }


        .buttons {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

        }


        .action {

            padding: 12px;

            border-radius: 9px;

            border:
                1px solid #333;

            background: #17171d;

            color: white;

            cursor: pointer;

            font-weight: bold;

        }


        .action:hover {

            background: #25252d;

        }


        .action.connected {

            border-color: #245c3d;

            background: #14231b;

        }


        .empty {

            text-align: center;

            padding: 40px 20px;

            color: #777;

        }


        @media (max-width: 600px) {

            header {

                align-items: flex-start;

            }


            .buttons {

                grid-template-columns: 1fr;

            }

        }

        #map {
    width: 100%;
    height: 400px;
    margin-bottom: 20px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
}

    </style>

    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <header>

        <div class="logo">
            VEIL
        </div>

        <div class="status">
            ● SYSTEM ONLINE
        </div>

    </header>


    <!-- WELCOME -->

    <section class="welcome">

        <h2>
            Dashboard
        </h2>

        <p>
            Lost Phone Protection System
        </p>

    </section>


    <!-- DEVICE CARD -->
    
    <!-- MAP LOKASI -->
    
    <div id="map"></div>

    <section class="card">


        <div class="card-title">

            <h3>
                Perangkat Saya
            </h3>


            <button
                class="add-button"
                onclick="addDevice()"
            >
                + Tambah HP
            </button>

        </div>


        <div class="device">


            <div class="device-top">


                <div
                    class="device-name"
                    id="deviceName"
                >
                    📱 Perangkat VEIL
                </div>


                <div
                    class="offline"
                    id="deviceStatus"
                >
                    🔴 Belum Terhubung
                </div>


            </div>


            <div
                class="device-info"
                id="deviceInfo"
            >

                Daftarkan aplikasi VEIL
                pada HP terlebih dahulu.

                <br>

                Status: Menunggu perangkat

            </div>


            <div class="buttons">


                <button
                    class="action"
                    id="locationButton"
                    onclick="locationFeature()"
                >
                    📍 Lokasi
                </button>


                <button
                    class="action"
                    id="lostModeButton"
                    onclick="lostModeFeature()"
                >
                    🔒 Lost Mode
                </button>


                <button
                    class="action"
                    id="messageButton"
                    onclick="textFeature()"
                >
                    🔊 Pesan
                </button>


            </div>


        </div>


    </section>


</div>



<script>


// =====================================================
// STATUS PERANGKAT
// =====================================================

let deviceConnected = false;

let connectedDevice = null;

let map = null;
let locationMarker = null;



// =====================================================
// TAMBAH HP
// =====================================================

function addDevice() {

    window.location.href =
        "pair.html";

}



// =====================================================
// CEK STATUS PERANGKAT
// =====================================================

async function checkDeviceStatus() {

    try {


        const email =
            localStorage.getItem(
                "veil_verified_email"
            );


        if (!email) {

            console.log(
                "VEIL: email belum ditemukan."
            );

            deviceConnected = false;

            updateDeviceUI();

            return;

        }


        const response =
            await fetch(
                "/api/device-status",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            email: email
                        })

                }
            );


        const result =
            await response.json();


        console.log(
            "VEIL DEVICE STATUS:",
            result
        );


        if (
            result.success === true &&
            result.connectedDevices > 0
        ) {


            deviceConnected = true;


            if (
                result.devices &&
                result.devices.length > 0
            ) {

                connectedDevice =
                    result.devices[0];
                console.log("VEIL CONNECTED DEVICE:", connectedDevice);    

            } else {

                connectedDevice = null;

            }


        } else {


            deviceConnected = false;

            connectedDevice = null;

        }


        updateDeviceUI();


    } catch (error) {


        console.error(
            "VEIL status error:",
            error
        );


        deviceConnected = false;

        connectedDevice = null;

        updateDeviceUI();


    }

}



// =====================================================
// UPDATE TAMPILAN
// =====================================================

function updateDeviceUI() {


    const deviceName =
        document.getElementById(
            "deviceName"
        );


    const deviceStatus =
        document.getElementById(
            "deviceStatus"
        );


    const deviceInfo =
        document.getElementById(
            "deviceInfo"
        );


    const locationButton =
        document.getElementById(
            "locationButton"
        );


    const lostModeButton =
        document.getElementById(
            "lostModeButton"
        );


    const messageButton =
        document.getElementById(
            "messageButton"
        );



    // ================================================
    // TERHUBUNG
    // ================================================

    if (deviceConnected) {


        const name =
            connectedDevice &&
            connectedDevice.deviceName
                ? connectedDevice.deviceName
                : "Perangkat VEIL";


        deviceName.innerHTML =
            "📱 " + name;


        deviceStatus.className =
            "online";


        deviceStatus.innerHTML =
            "🟢 Terhubung";


        deviceInfo.innerHTML =
            "Perangkat VEIL berhasil terhubung."
            +
            "<br>"
            +
            "Status: Perangkat aktif";


        locationButton.classList.add(
            "connected"
        );


        lostModeButton.classList.add(
            "connected"
        );


        messageButton.classList.add(
            "connected"
        );


    }


    // ================================================
    // BELUM TERHUBUNG
    // ================================================

    else {


        deviceName.innerHTML =
            "📱 Perangkat VEIL";


        deviceStatus.className =
            "offline";


        deviceStatus.innerHTML =
            "🔴 Belum Terhubung";


        deviceInfo.innerHTML =
            "Daftarkan aplikasi VEIL"
            +
            " pada HP terlebih dahulu."
            +
            "<br>"
            +
            "Status: Menunggu perangkat";


        locationButton.classList.remove(
            "connected"
        );


        lostModeButton.classList.remove(
            "connected"
        );


        messageButton.classList.remove(
            "connected"
        );

    }

}



// =====================================================
// FITUR LOKASI
// =====================================================

function showLocationOnMap(latitude, longitude, accuracy) {

    if (!map) {

        map = L.map("map").setView(
            [latitude, longitude],
            16
        );

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap"
            }
        ).addTo(map);

    } else {

        map.setView(
            [latitude, longitude],
            16
        );

    }


    if (locationMarker) {

        locationMarker.setLatLng([
            latitude,
            longitude
        ]);

    } else {

        locationMarker =
            L.marker([
                latitude,
                longitude
            ]).addTo(map);

    }


    locationMarker.bindPopup(
        "📍 Perangkat VEIL<br>" +
        "Akurasi: ±" +
        Number(accuracy).toFixed(1) +
        " meter"
    ).openPopup();

}


async function locationFeature() {

    if (!deviceConnected || !connectedDevice) {
        alert("Perangkat VEIL belum terhubung.");
        return;
    }

    const email =
        localStorage.getItem("veil_verified_email") ||
        localStorage.getItem("veil_email");

    if (!email) {
        alert("Email VEIL tidak ditemukan.");
        return;
    }

    const deviceId =
        connectedDevice.deviceId;

    if (!deviceId) {
        alert("Device ID tidak ditemukan.");
        return;
    }

    try {

        // ==========================================
        // 1. MINTA HP TEMAN KIRIM LOKASI
        // ==========================================

        const requestResponse =
            await fetch("/api/request-location", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    email: email,

                    deviceId: deviceId

                })

            });


        const requestResult =
            await requestResponse.json();


        console.log(
            "VEIL LOCATION REQUEST:",
            requestResult
        );


        if (
            !requestResponse.ok ||
            requestResult.success !== true
        ) {

            alert(
                requestResult.message ||
                "Permintaan lokasi gagal."
            );

            return;
        }


        // ==========================================
        // 2. TUNGGU HP TEMAN MENGIRIM LOKASI
        // ==========================================

        alert(
            "📍 Permintaan lokasi dikirim.\n\n" +
            "Menunggu GPS perangkat..."
        );


        let attempts = 0;

        const maxAttempts = 15;


        const checkLocation =
            setInterval(async () => {

                attempts++;


                try {

                    const locationResponse =
                        await fetch(
                            "/api/device-location",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    email: email,

                                    deviceId: deviceId

                                })

                            }
                        );


                    const locationResult =
                        await locationResponse.json();


                    console.log(
                        "VEIL LOCATION CHECK:",
                        locationResult
                    );


                    if (
                        locationResult.success === true &&
                        locationResult.location
                    ) {

                        clearInterval(checkLocation);

                        const location =
                            locationResult.location;

                        showLocationOnMap(
                        location.latitude,
                        location.longitude,
                        location.accuracy
                        );    
                        return;
                    }

                        const mapsUrl =
                            "https://www.google.com/maps/search/?api=1&query=" +
                            location.latitude +
                            "," +
                            location.longitude;

                            window.open(mapsUrl, "_blank");


                            return;
                    }


                    if (
                        attempts >= maxAttempts
                    ) {

                        clearInterval(
                            checkLocation
                        );


                        alert(
                            "⏱️ Lokasi belum diterima.\n\n" +
                            "Pastikan HP teman masih membuka " +
                            "halaman pairing VEIL."
                        );

                    }


                } catch (error) {

                    console.error(
                        "VEIL LOCATION CHECK ERROR:",
                        error
                    );

                }

            }, 2000);


    } catch (error) {

        console.error(
            "VEIL LOCATION REQUEST ERROR:",
            error
        );

        alert(
            "Gagal meminta lokasi perangkat."
        );

    }

}


// =====================================================
// LOST MODE
// =====================================================

function lostModeFeature() {


    if (!deviceConnected) {

        alert(
            "Lost Mode akan aktif setelah perangkat VEIL terhubung."
        );

        return;

    }


    alert(
        "Perangkat terhubung.\n\nLost Mode siap digunakan."
    );

}



// =====================================================
// PESAN
// =====================================================

function textFeature() {


    if (!deviceConnected) {

        alert(
            "Fitur pesan akan aktif setelah perangkat VEIL terhubung."
        );

        return;

    }


    alert(
        "Perangkat terhubung.\n\nFitur pesan siap digunakan."
    );

}



// =====================================================
// MULAI
// =====================================================

checkDeviceStatus();



// =====================================================
// CEK OTOMATIS SETIAP 3 DETIK
// =====================================================

setInterval(
    checkDeviceStatus,
    3000
);


</script>


</body>

</html>

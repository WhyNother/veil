<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEIL - Hubungkan Perangkat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            background:
                linear-gradient(rgba(3, 15, 40, 0.90), rgba(3, 15, 40, 0.95)),
                url("veil-bg.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 92%;
            max-width: 430px;
        }

        .logo {
            text-align: center;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 8px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #4da3ff;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .card {
            padding: 30px 25px;
            border-radius: 20px;

            background: rgba(5, 20, 50, 0.80);
            border: 1px solid rgba(80, 170, 255, 0.35);

            box-shadow:
                0 0 30px rgba(0, 120, 255, 0.20);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 25px;
        }

        .description {
            text-align: center;
            color: #b9c8dc;
            line-height: 1.5;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            height: 60px;

            border: 1px solid rgba(100, 180, 255, 0.5);
            border-radius: 12px;

            background: rgba(0, 0, 0, 0.25);
            color: white;

            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 8px;

            outline: none;
        }

        input:focus {
            border-color: #299cff;
            box-shadow: 0 0 15px rgba(41, 156, 255, 0.3);
        }

        button {
            width: 100%;
            height: 55px;

            margin-top: 18px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(90deg, #ff4d4d, #ff6868);

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            padding: 12px;

            border-radius: 10px;

            text-align: center;
            font-size: 14px;

            display: none;
        }

        #message.success {
            display: block;
            background: rgba(0, 180, 100, 0.15);
            border: 1px solid rgba(0, 220, 130, 0.5);
            color: #54ffac;
        }

        #message.error {
            display: block;
            background: rgba(255, 60, 60, 0.15);
            border: 1px solid rgba(255, 80, 80, 0.5);
            color: #ff7777;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: #80bfff;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">VEIL</div>

    <div class="subtitle">
        Lost Phone Protection System
    </div>

    <div class="card">

        <h2>Hubungkan Perangkat</h2>

        <div class="description">
            Masukkan kode pairing 6 digit yang
            diberikan oleh pemilik akun VEIL.
        </div>

        <input
            id="code"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
            autocomplete="off"
        >

        <button id="pairButton" onclick="pairDevice()">
            HUBUNGKAN
        </button>

        <div id="message"></div>

        <a href="index.html" class="back">
            ← Kembali
        </a>

    </div>

</div>


<script>

    // ==========================================
    // ALAMAT SERVER VEIL
    // ==========================================

    // Untuk TEST DI LAPTOP:
    const SERVER_URL = "https://survivor-asus-excitement-openings.trycloudflare.com";

    // NANTI kalau server sudah memakai Cloudflare Tunnel,
    // ubah menjadi contoh:
    //
    // const SERVER_URL = "https://alamat-tunnel-kamu.trycloudflare.com";


    // ==========================================
    // AMBIL ELEMENT
    // ==========================================

    const codeInput = document.getElementById("code");
    const pairButton = document.getElementById("pairButton");
    const message = document.getElementById("message");


    // ==========================================
    // HANYA IZINKAN ANGKA
    // ==========================================

    codeInput.addEventListener("input", function () {

        this.value = this.value
            .replace(/\D/g, "")
            .slice(0, 6);

    });


    // ==========================================
    // HUBUNGKAN PERANGKAT
    // ==========================================

    async function pairDevice() {

        const code = codeInput.value.trim();

        message.className = "";
        message.textContent = "";
        message.style.display = "none";


        // Validasi kode

        if (!/^\d{6}$/.test(code)) {

            message.className = "error";
            message.textContent =
                "Kode pairing harus terdiri dari 6 angka.";

            return;
        }


        // Disable tombol

        pairButton.disabled = true;
        pairButton.textContent = "MENGHUBUNGKAN...";


        try {

            const response = await fetch(
                `${SERVER_URL}/api/pair-device`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        code: code
                    })
                }
            );


            const result = await response.json();


            // ==================================
            // GAGAL
            // ==================================

            if (!response.ok || !result.success) {

                message.className = "error";

                message.textContent =
                    result.message ||
                    "Kode pairing tidak valid.";

                return;
            }


            // ==================================
            // BERHASIL
            // ==================================

            message.className = "success";

            message.textContent =
                "✓ Perangkat berhasil terhubung.";


            codeInput.value = "";


        } catch (error) {

            console.error(error);

            message.className = "error";

            message.textContent =
                "Server VEIL tidak dapat dihubungi.";

        } finally {

            pairButton.disabled = false;
            pairButton.textContent = "HUBUNGKAN";

        }

    }

</script>

</body>
</html>

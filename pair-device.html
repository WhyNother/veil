<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VEIL - Hubungkan Perangkat</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            color: white;

            background:
                linear-gradient(
                    rgba(3, 15, 40, 0.90),
                    rgba(3, 15, 40, 0.95)
                ),
                url("veil-bg.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 92%;
            max-width: 430px;
        }

        .logo {
            text-align: center;

            font-size: 48px;
            font-weight: 800;

            letter-spacing: 8px;

            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;

            color: #4da3ff;

            font-size: 14px;
            letter-spacing: 2px;

            margin-bottom: 35px;
        }

        .card {
            padding: 30px 25px;

            border-radius: 20px;

            background:
                rgba(5, 20, 50, 0.80);

            border:
                1px solid
                rgba(80, 170, 255, 0.35);

            box-shadow:
                0 0 30px
                rgba(0, 120, 255, 0.20);
        }

        h2 {
            margin-top: 0;

            text-align: center;

            font-size: 25px;
        }

        .description {
            text-align: center;

            color: #b9c8dc;

            line-height: 1.5;

            font-size: 14px;

            margin-bottom: 25px;
        }

        input {
            width: 100%;
            height: 60px;

            border:
                1px solid
                rgba(100, 180, 255, 0.5);

            border-radius: 12px;

            background:
                rgba(0, 0, 0, 0.25);

            color: white;

            text-align: center;

            font-size: 28px;
            font-weight: bold;

            letter-spacing: 8px;

            outline: none;
        }

        input:focus {
            border-color: #299cff;

            box-shadow:
                0 0 15px
                rgba(41, 156, 255, 0.3);
        }

        button {
            width: 100%;
            height: 55px;

            margin-top: 18px;

            border: none;
            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #ff4d4d,
                    #ff6868
                );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;

            display: none;
        }

        #message.success {
            display: block;

            background:
                rgba(0, 180, 100, 0.15);

            border:
                1px solid
                rgba(0, 220, 130, 0.5);

            color: #54ffac;
        }

        #message.error {
            display: block;

            background:
                rgba(255, 60, 60, 0.15);

            border:
                1px solid
                rgba(255, 80, 80, 0.5);

            color: #ff7777;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #80bfff;

            text-decoration: none;

            font-size: 14px;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="logo">
        VEIL
    </div>

    <div class="subtitle">
        Lost Phone Protection System
    </div>

    <div class="card">

        <h2>
            Hubungkan Perangkat
        </h2>

        <div class="description">
            Masukkan kode pairing 6 digit
            yang diberikan oleh pemilik
            akun VEIL.
        </div>

        <input
            id="code"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
            autocomplete="off"
        >

        <button
            id="pairButton"
            onclick="pairDevice()"
        >
            HUBUNGKAN
        </button>

        <div id="message"></div>

        <a
            href="index.html"
            class="back"
        >
            ← Kembali
        </a>

    </div>

</div>


<script>


// =====================================================
// SERVER
// =====================================================

const SERVER_URL = "";


// =====================================================
// ELEMENT
// =====================================================

const codeInput =
    document.getElementById("code");

const pairButton =
    document.getElementById("pairButton");

const message =
    document.getElementById("message");


// =====================================================
// IDENTITAS DEVICE
// =====================================================

let deviceId =
    localStorage.getItem("veil_device_id");


if (!deviceId) {

    if (
        window.crypto &&
        typeof window.crypto.randomUUID ===
        "function"
    ) {

        deviceId =
            window.crypto.randomUUID();

    } else {

        deviceId =
            "veil-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2, 12);

    }

    localStorage.setItem(
        "veil_device_id",
        deviceId
    );
}


// =====================================================
// NAMA / MODEL DEVICE
// =====================================================

let deviceName =
    localStorage.getItem("veil_device_name");


async function getDeviceName() {

    // Kalau sudah pernah tersimpan, pakai yang lama
    if (
    deviceName &&
    deviceName !== "Perangkat VEIL"
) {
    return deviceName;
}
    let detectedName = "Perangkat VEIL";

    try {

        if (
            navigator.userAgentData &&
            navigator.userAgentData.getHighEntropyValues
        ) {

            const info =
                await navigator.userAgentData.getHighEntropyValues([
                    "model",
                    "platform"
                ]);

            if (info.model) {

                detectedName =
                    info.model;

            } else if (info.platform) {

                detectedName =
                    info.platform;

            }

        } else {

            // Fallback untuk browser yang tidak mendukung userAgentData

            const ua =
                navigator.userAgent;

            if (/Android/i.test(ua)) {

                detectedName =
                    "Perangkat Android";

            } else if (/iPhone/i.test(ua)) {

                detectedName =
                    "iPhone";

            } else if (/iPad/i.test(ua)) {

                detectedName =
                    "iPad";

            } else {

                detectedName =
                    "Perangkat VEIL";

            }

        }

    } catch (error) {

        console.warn(
            "Gagal mendeteksi model perangkat:",
            error
        );

    }

    deviceName =
        detectedName;

    localStorage.setItem(
        "veil_device_name",
        deviceName
    );

    return deviceName;
}


// =====================================================
// INPUT KODE
// =====================================================

codeInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 6);

    }
);


// =====================================================
// REQUEST ID TERAKHIR
// =====================================================

let lastRequestId = null;


// =====================================================
// PAIR DEVICE
// =====================================================

async function pairDevice() {

    const code =
        codeInput.value.trim();

        const currentDeviceName =
            await getDeviceName();


    message.className = "";

    message.textContent = "";

    message.style.display = "none";


    if (!/^\d{6}$/.test(code)) {

        message.className =
            "error";

        message.textContent =
            "Kode pairing harus terdiri dari 6 angka.";

        return;
    }


    pairButton.disabled = true;

    pairButton.textContent =
        "MENGHUBUNGKAN...";


    try {

        const response =
            await fetch(
                `${SERVER_URL}/api/pair-device`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            code:
                                code,

                            deviceId:
                                deviceId,

                            deviceName:
                                currentDeviceName

                        })
                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            message.className =
                "error";

            message.textContent =
                result.message ||
                "Kode pairing tidak valid.";

            return;
        }


        // =================================================
        // SIMPAN IDENTITAS PAIRING
        // =================================================

        localStorage.setItem(
            "veil_email",
            result.email ||
            getPairingEmailFallback()
        );

        localStorage.setItem(
            "veil_device_id",
            deviceId
        );

        localStorage.setItem(
            "veil_device_name",
            currentDeviceName
        );

        deviceName =
            currentDeviceName

        // =================================================
        // TAMPILAN BERHASIL
        // =================================================

        document.querySelector(".card").innerHTML = `

            <div style="
                text-align:center;
                padding:20px 5px;
            ">

                <div style="
                    width:80px;
                    height:80px;
                    margin:0 auto 20px;
                    border-radius:50%;
                    background:rgba(0,220,130,0.15);
                    border:2px solid #54ffac;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:42px;
                    color:#54ffac;
                ">
                    ✓
                </div>

                <h2 style="
                    color:#54ffac;
                    margin-bottom:15px;
                ">
                    Perangkat Berhasil Terhubung
                </h2>

                <div style="
                    color:#b9c8dc;
                    line-height:1.6;
                    font-size:14px;
                ">
                    Perangkat ini sudah berhasil
                    terhubung ke akun VEIL.
                    <br><br>
                    Halaman ini akan tetap aktif
                    untuk menerima permintaan lokasi.
                </div>

                <div id="locationStatus"
                    style="
                        margin-top:20px;
                        padding:12px;
                        border-radius:10px;
                        background:rgba(0,0,0,0.20);
                        color:#ffffff;
                        font-size:13px;
                        line-height:1.6;
                    "
                >
                    📍 Menyiapkan GPS...
                </div>

                <div style="
                    margin-top:20px;
                    padding:12px;
                    border-radius:10px;
                    background:rgba(0,0,0,0.20);
                    color:#80bfff;
                    font-size:13px;
                ">
                    ${deviceName}
                </div>

            </div>

        `;


        // =================================================
        // KIRIM LOKASI PERTAMA
        // =================================================

        sendCurrentLocation();


        // =================================================
        // MULAI MENUNGGU REQUEST LOKASI
        // =================================================

        startLocationRequestListener();


    }

    catch (error) {

        console.error(
            "VEIL pairing error:",
            error
        );

        message.className =
            "error";

        message.textContent =
            "Server VEIL tidak dapat dihubungi.";

    }

    finally {

        pairButton.disabled =
            false;

        pairButton.textContent =
            "HUBUNGKAN";

    }

}


// =====================================================
// FALLBACK EMAIL
// =====================================================
//
// Catatan:
// Endpoint /api/pair-device yang sekarang lu kirim
// BELUM mengembalikan result.email.
//
// Jadi untuk penyimpanan email yang benar,
// kita perlu response server mengembalikan email.
//
// Fungsi ini hanya fallback sementara.
//

function getPairingEmailFallback() {

    return localStorage.getItem(
        "veil_email"
    ) || "";

}


// =====================================================
// KIRIM GPS SEKARANG
// =====================================================

function sendCurrentLocation() {

    if (!navigator.geolocation) {

        updateLocationStatus(
            "❌ Browser tidak mendukung GPS."
        );

        return;

    }


    updateLocationStatus(
        "📍 Meminta izin lokasi..."
    );


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            updateLocationStatus(
                "📍 Lokasi ditemukan. Mengirim..."
            );


            try {

                const email =
                    localStorage.getItem(
                        "veil_email"
                    );


                if (!email) {

                    updateLocationStatus(
                        "⚠️ Email perangkat belum tersimpan."
                    );

                    return;
                }


                const response =
                    await fetch(
                        `${SERVER_URL}/api/update-location`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    email:
                                        email,

                                    deviceId:
                                        deviceId,

                                    latitude:
                                        latitude,

                                    longitude:
                                        longitude,

                                    accuracy:
                                        accuracy

                                })
                        }
                    );


                const result =
                    await response.json();


                if (
                    !response.ok ||
                    !result.success
                ) {

                    updateLocationStatus(
                        "❌ Gagal mengirim lokasi."
                    );

                    console.error(
                        result
                    );

                    return;
                }


                updateLocationStatus(

                    "🟢 Lokasi berhasil dikirim." +
                    "<br><br>" +

                    "Akurasi: ±" +
                    Math.round(accuracy) +
                    " meter"

                );


                console.log(
                    "VEIL LOCATION UPDATE:",
                    result
                );

            }

            catch (error) {

                console.error(
                    "Location update error:",
                    error
                );

                updateLocationStatus(
                    "❌ Gagal terhubung ke server."
                );

            }

        },


        function(error) {

            console.error(
                "VEIL GPS ERROR:",
                error
            );


            updateLocationStatus(

                "⚠️ Izin GPS gagal: " +
                error.message

            );

        },


        {
            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );

}


// =====================================================
// CEK REQUEST LOKASI
// =====================================================

async function checkLocationRequest() {

    const email =
        localStorage.getItem(
            "veil_email"
        );


    const savedDeviceId =
        localStorage.getItem(
            "veil_device_id"
        );


    if (
        !email ||
        !savedDeviceId
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                `${SERVER_URL}/api/location-request`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            email:
                                email,

                            deviceId:
                                savedDeviceId

                        })
                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            return;

        }


        if (!result.request) {

            return;

        }


        const request =
            result.request;


        // Jangan proses request yang sama
        // berulang-ulang

        if (
            request.requestId ===
            lastRequestId
        ) {

            return;

        }


        lastRequestId =
            request.requestId;


        console.log(
            "VEIL: request lokasi diterima",
            request.requestId
        );


        // =================================================
        // OTOMATIS AMBIL GPS
        // =================================================

        updateLocationStatus(
            "📍 Permintaan lokasi diterima. Mengambil GPS..."
        );


        sendCurrentLocation();

    }

    catch (error) {

        console.error(
            "VEIL request location error:",
            error
        );

    }

}


// =====================================================
// LISTENER REQUEST
// =====================================================

function startLocationRequestListener() {

    // langsung cek

    checkLocationRequest();


    // lalu cek setiap 3 detik

    setInterval(
        checkLocationRequest,
        3000
    );

}


// =====================================================
// STATUS GPS
// =====================================================

function updateLocationStatus(text) {

    const element =
        document.getElementById(
            "locationStatus"
        );


    if (element) {

        element.innerHTML =
            text;

    }

}


</script>

</body>

</html>
